# Weekly: sync Globus -> Hugging Face, then release a new PyPI version if the catalog changed.
# On a pushed tag v*: build and publish that version.
#
# Disk: archives are mirrored one file at a time (sync.py stream_mirror), so a job only needs room
# for the largest single file (~17 GB, Basilisk), not the whole archive. Every changed dataset gets
# its own runner (matrix); preinstalled toolchains and docker images are removed as in the SZ3
# integration tests, and the larger of / and /mnt is used.
#
# Setup (once):
#   - repository secret HF_TOKEN: Hugging Face token with write access to the sdrbench org
#   - PyPI trusted publisher for project "sdrbench": owner szcompressor, repo sdrbench,
#     workflow release.yml, environment pypi
name: sync-and-release

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Force re-mirror of these datasets (space separated), e.g. 'nyx hacc'"
        required: false
        default: ""
      release:
        description: "Tag and publish a release even if nothing changed"
        type: boolean
        default: false
      dry:
        description: "Dry run: download, unpack and hash on the runner, but upload/commit nothing"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      datasets: ${{ steps.plan.outputs.datasets }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Compare Globus and the SDRBench page with sync/state.json
        id: check
        run: python sync/sync.py check --output check.json
      - name: Datasets to mirror
        id: plan
        run: python sync/sync.py plan check.json --extra ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
      - name: Open an issue when the SDRBench page lists new or removed archives
        if: steps.check.outputs.attention == 'true'
        run: |
          body=$(python -c "
          import json
          r = json.load(open('check.json'))
          print('New archives on the SDRBench page (add them to sync/datasets.json):')
          print(chr(10).join('- ' + x for x in r['new_on_page']) or '- none')
          print()
          print('Mirrored archives no longer on the page:')
          print(chr(10).join('- ' + x for x in r['gone_from_page']) or '- none')
          ")
          title="SDRBench page changed: archives added/removed"
          if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body "$body"
          fi

  mirror:
    needs: check
    if: needs.check.outputs.datasets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: ${{ fromJSON(needs.check.outputs.datasets) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Maximize disk space (as in the SZ3 integration tests) and pick the roomiest mount
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force
          best=$(df -B1 --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -rn | head -1 | awk '{print $2}')
          sudo mkdir -p "$best/sdrbench" && sudo chown "$USER" "$best/sdrbench"
          echo "WORK=$best/sdrbench" >> "$GITHUB_ENV"
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Mirror ${{ matrix.dataset }} (archives streamed one file at a time)
        run: |
          python sync/sync.py mirror --only ${{ matrix.dataset }} --workdir "$WORK" \
            --state-out "state-${{ matrix.dataset }}.json" --fail-on-skip \
            ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '--dry' || '' }}
          df -h "$WORK"
      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.dataset }}
          path: state-${{ matrix.dataset }}.json

  finalize:
    needs: [check, mirror]
    if: >-
      always() && needs.check.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry) &&
      (needs.mirror.result == 'success' ||
       (needs.mirror.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        if: needs.mirror.result == 'success'
        with:
          pattern: state-*
          path: fragments
          merge-multiple: true
      - name: Merge state, rebuild catalog, test, verify against the data, refresh dataset cards
        if: needs.mirror.result == 'success'
        run: |
          python sync/sync.py merge fragments/*.json
          python sync/sync.py catalog
          pytest -q
          python sync/sync.py verify --only ${{ join(fromJSON(needs.check.outputs.datasets), ' ') }}
          python sync/sync.py cards --only ${{ join(fromJSON(needs.check.outputs.datasets), ' ') }}
      - name: Commit catalog and tag a new version
        id: tag
        run: |
          git config user.name "sdrbench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          if ! git diff --quiet -- sync/state.json src/sdrbench/catalog.json; then
            git add sync/state.json src/sdrbench/catalog.json
            git commit -m "Sync SDRBench mirror ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
            changed=true
          fi
          if [ "$changed" = true ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.release }}" = true ]; then
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v${major}.${minor}.$((patch + 1))"
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: finalize
    if: ${{ always() && (github.event_name == 'push' || needs.finalize.outputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || needs.finalize.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine pytest
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the built wheel
        run: |
          pip install dist/*.whl
          mv src src.hidden   # make sure tests import the installed wheel
          pytest -q
          python -c "import sdrbench; print(sdrbench.__version__, len(sdrbench.list()), 'datasets')"
          mv src.hidden src
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sdrbench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
