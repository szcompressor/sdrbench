# Weekly: sync Globus -> Hugging Face, then release a new PyPI version if the catalog changed.
# On a pushed tag v*: build and publish that version.
#
# Setup (once):
#   - repository secret HF_TOKEN: fine-grained Hugging Face token with write access to the sdrbench org
#   - PyPI trusted publisher for project "sdrbench": owner szcompressor, repo sdrbench,
#     workflow release.yml, environment pypi
name: sync-and-release

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Force re-mirror of these datasets (space separated), e.g. 'nyx hacc'"
        required: false
        default: ""
      release:
        description: "Tag and publish a release even if nothing changed"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
      issues: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"

      - name: Check Globus and the SDRBench page for changes
        id: check
        run: python sync/sync.py check --output check.json

      - name: Free disk space for large archives
        if: steps.check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.only != '')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h "$RUNNER_TEMP"

      - name: Mirror changed archives to Hugging Face
        if: steps.check.outputs.changed == 'true'
        run: python sync/sync.py mirror --changed check.json --workdir "$RUNNER_TEMP/sdrbench" --fail-on-skip

      - name: Mirror forced datasets
        if: (github.event_name == 'workflow_dispatch' && inputs.only != '')
        run: python sync/sync.py mirror --only ${{ inputs.only }} --workdir "$RUNNER_TEMP/sdrbench" --fail-on-skip

      - name: Rebuild catalog, verify dtypes/shapes against the data, refresh dataset cards
        if: steps.check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.only != '')
        run: |
          python sync/sync.py catalog
          pytest -q
          python sync/sync.py verify
          python sync/sync.py cards

      - name: Commit catalog and tag a new version
        id: tag
        run: |
          git config user.name "sdrbench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          if ! git diff --quiet -- sync/state.json src/sdrbench/catalog.json; then
            git add sync/state.json src/sdrbench/catalog.json
            git commit -m "Sync SDRBench mirror ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
            changed=true
          fi
          if [ "$changed" = true ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.release }}" = true ]; then
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v${major}.${minor}.$((patch + 1))"
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue when the SDRBench page lists new or removed archives
        if: steps.check.outputs.attention == 'true'
        run: |
          body=$(python -c "import json;r=json.load(open('check.json'));print('New archives on the SDRBench page (add them to sync/datasets.json):\n'+'\n'.join('- '+x for x in r['new_on_page'])+'\n\nMirrored archives no longer on the page:\n'+'\n'.join('- '+x for x in r['gone_from_page']))")
          title="SDRBench page changed: archives added/removed"
          if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body "$body"
          fi

  build:
    needs: sync
    if: ${{ always() && (github.event_name == 'push' || needs.sync.outputs.tag != '') && needs.sync.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || needs.sync.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine pytest
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the built wheel
        run: |
          pip install dist/*.whl
          mv src src.hidden   # make sure tests import the installed wheel
          pytest -q
          python -c "import sdrbench; print(sdrbench.__version__, len(sdrbench.datasets()), 'datasets')"
          mv src.hidden src
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sdrbench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
